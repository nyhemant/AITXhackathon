<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="vz-map-title">
  <title id="vz-map-title">Illustrated zoo map. Follow the path from IN. Tap the glowing habitat photo.</title>
