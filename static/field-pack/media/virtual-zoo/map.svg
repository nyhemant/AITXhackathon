    <path class="vz-trail-dash" d="M379.0,756.0 Q368.3,699.6 316.0,676.0 Q236.8,640.3 216.0,556.0 Q183.8,437.2 88.0,360.0 Q218.5,302.4 360.0,320.0 Q385.8,194.3 336.0,76.0 Q430.8,40.0 524.0,80.0 Q594.3,175.2 708.0,208.0 Q746.0,294.0 708.0,380.0 Q654.6,461.2 676.0,556.0 Q608.2,647.5 498.0,676.0 Q477.7,716.3 499.0,756.0" fill="none"/>
