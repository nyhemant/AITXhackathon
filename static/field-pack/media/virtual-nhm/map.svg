<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img">
  <title>Natural history museum. Four halls: Ocean, Rainforest, Dinosaur, Mammal.</title>
  <defs>
    <clipPath id="vz-photo-clip" clipPathUnits="objectBoundingBox">
      <circle cx="0.5" cy="0.5" r="0.5"/>
    </clipPath>
    <filter id="pad-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.2" flood-color="#1a1814" flood-opacity="0.38"/>
    </filter>
  </defs>
  <image href="/field-pack/media/virtual-nhm/park-ground.jpg?v=2" x="0" y="0" width="800" height="800" preserveAspectRatio="xMidYMid slice"/>
  <a href="/field-pack/virtual-field-trip/?tab=natural-history#habitat=sci-rainforest" id="habitat-sci-rainforest" class="vz-spot" data-habitat="sci-rainforest" aria-label="Rainforest Hall">
    <rect class="vz-hit" x="80" y="80" width="136" height="136" fill="transparent"/>
    <rect class="vz-halo" x="81.0" y="81.0" width="134.0" height="134.0" rx="22.0"/>
    <rect class="vz-silo" x="86" y="86" width="124" height="124" rx="18" fill="#fff" stroke="#1f2a2a" stroke-width="2.6" filter="url(#pad-shadow)"/>
    <image href="/field-pack/photos/sci-rainforest.jpg?v=img3" x="90" y="90" width="116" height="116" preserveAspectRatio="xMidYMin slice" clip-path="url(#vz-photo-clip)"/>
    <g class="vz-spot-label-g">
      <rect class="vz-spot-label-bg" x="21" y="232" width="198" height="33" rx="10"/>
      <text class="vz-spot-label" x="148" y="256" text-anchor="middle" font-size="28">Rainforest Hall</text>
    </g>
  </a>
  <a href="/field-pack/virtual-field-trip/?tab=natural-history#habitat=sci-dinosaur" id="habitat-sci-dinosaur" class="vz-spot" data-habitat="sci-dinosaur" aria-label="Dinosaur Hall">
    <rect class="vz-hit" x="520" y="80" width="136" height="136" fill="transparent"/>
    <rect class="vz-halo" x="521.0" y="81.0" width="134.0" height="134.0" rx="22.0"/>
    <rect class="vz-silo" x="526" y="86" width="124" height="124" rx="18" fill="#fff" stroke="#1f2a2a" stroke-width="2.6" filter="url(#pad-shadow)"/>
    <image href="/field-pack/photos/sci-dinosaur.jpg?v=img2" x="530" y="90" width="116" height="116" preserveAspectRatio="xMidYMin slice" clip-path="url(#vz-photo-clip)"/>
    <g class="vz-spot-label-g">
      <rect class="vz-spot-label-bg" x="477" y="232" width="222" height="33" rx="10"/>
      <text class="vz-spot-label" x="588" y="256" text-anchor="middle" font-size="28">Dinosaur Hall</text>
    </g>
  </a>
  <a href="/field-pack/virtual-field-trip/?tab=natural-history#habitat=sci-aquarium-zone" id="habitat-sci-aquarium-zone" class="vz-spot" data-habitat="sci-aquarium-zone" aria-label="Ocean Hall">
    <rect class="vz-hit" x="80" y="520" width="136" height="136" fill="transparent"/>
    <rect class="vz-halo" x="81.0" y="521.0" width="134.0" height="134.0" rx="22.0"/>
    <rect class="vz-silo" x="86" y="526" width="124" height="124" rx="18" fill="#fff" stroke="#1f2a2a" stroke-width="2.6" filter="url(#pad-shadow)"/>
    <image href="/field-pack/photos/sci-aquarium-zone.jpg?v=img2" x="90" y="530" width="116" height="116" preserveAspectRatio="xMidYMin slice" clip-path="url(#vz-photo-clip)"/>
    <g class="vz-spot-label-g">
      <rect class="vz-spot-label-bg" x="48" y="672" width="200" height="33" rx="10"/>
      <text class="vz-spot-label" x="148" y="696" text-anchor="middle" font-size="28">Ocean Hall</text>
    </g>
  </a>
  <a href="/field-pack/virtual-field-trip/?tab=natural-history#habitat=sci-mammal-hall" id="habitat-sci-mammal-hall" class="vz-spot" data-habitat="sci-mammal-hall" aria-label="Mammal Hall">
    <rect class="vz-hit" x="520" y="520" width="136" height="136" fill="transparent"/>
    <rect class="vz-halo" x="521.0" y="521.0" width="134.0" height="134.0" rx="22.0"/>
    <rect class="vz-silo" x="526" y="526" width="124" height="124" rx="18" fill="#fff" stroke="#1f2a2a" stroke-width="2.6" filter="url(#pad-shadow)"/>
    <image href="/field-pack/photos/sci-mammal-hall.jpg?v=img2" x="530" y="530" width="116" height="116" preserveAspectRatio="xMidYMin slice" clip-path="url(#vz-photo-clip)"/>
    <g class="vz-spot-label-g">
      <rect class="vz-spot-label-bg" x="478" y="672" width="220" height="33" rx="10"/>
      <text class="vz-spot-label" x="588" y="696" text-anchor="middle" font-size="28">Mammal Hall</text>
    </g>
  </a>
</svg>
